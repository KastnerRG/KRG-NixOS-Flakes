# fabricant-only vars (NOT group_vars/proxmox.yml — other PVE hosts must not
# inherit these). Covers fabricant's storage + host-scoped firewall, all wired as
# fabricant-scoped plays in playbooks/site.yml:
#   - nfs_server          NFSv4 exports on rpool/nfs
#   - zfs_limits          pool capacity policy (cap VM storage)
#   - proxmox_firewall    per-node host.fw (opens NFS tcp/2049 + ACME :80)
#   - proxmox_acme        Let's Encrypt cert for the pveproxy web UI
#   - ipmi_lan            enforce the BMC's static LAN IP in-band (ipmitool)

# ── BMC LAN (IPMI) ───────────────────────────────────────────────────────────
# fabricant's BMC static IP on the management VLAN, enforced in-band by the
# ipmi_lan role (idempotent; only writes on drift). netmask defaults to /24 and
# the gateway is left unmanaged (set ipmi_lan_netmask / ipmi_lan_gateway here to
# change). Defining this var is what opts fabricant into the site.yml ipmi_lan play.
ipmi_lan_address: "172.19.161.97"

# ── ZFS pool ─────────────────────────────────────────────────────────────────
# Confirmed via `zpool list` on fabricant: the only pool is `rpool` — a raidz1 over
# 4x ~15TB drives, ~37 TiB usable (~26 TiB free). It backs EVERYTHING: the PVE OS
# root (rpool/ROOT/pve-1 = /, currently holding a ~10.9 TiB backup of waiter data),
# the VM disks (rpool/data), and var-lib-vz. NFS datasets land under rpool/nfs
# (-> /srv/nfs).
nfs_pool: "rpool"

# ── Capacity policy: user data > VM data ─────────────────────────────────────
# Guarantee user/NFS data a 20 TiB floor (settable now: 20T <= ~26T free) and let
# it grow into spare space beyond that. No hard cap on NFS — the VMs are the
# bounded party instead (zfs_limits below). Raise the reservation once the ~10.9T
# waiter backup is dealt with and more space frees up.
nfs_parent_reservation: "20T"
nfs_parent_quota: ""        # no NFS cap; user data has priority

# Quotas/reservations on PRE-EXISTING (non-NFS) datasets, applied by zfs_limits.
# Cap the VM disk dataset so VMs (the less-important data) can't crowd user data or
# fill the pool. Only ~9 GB of VM disks exist today, so 2T is generous headroom.
zfs_limits:
  - { name: "rpool/data", quota: "2T" }     # VM disks (zvols)
  # - { name: "rpool/var-lib-vz", quota: "1T" }   # ISOs/templates/backups (uncomment to cap)

# ── Host-scoped PVE firewall (proxmox_firewall -> /etc/pve/nodes/fabricant/host.fw) ──
# Host-scoped ON PURPOSE (NOT cluster.fw): when the rebuilt breached host joins the
# cluster, cluster.fw rules would apply to it too — NFS must stay fabricant-only.
# Opens NFSv4 (tcp/2049) to the NFS clients. KEEP IN SYNC with the nfs_exports
# client list below.
proxmox_host_fw_rules:
  - "IN ACCEPT -source 137.110.161.67 -p tcp -dport 2049 -log nolog # NFSv4 (waiter)"
  # prometheus-pve-exporter (pve_exporter role): scraped ONLY by the monitoring
  # host (krg-prod, 137.110.161.106 = nix/networks/trusted.json monitoring_host).
  - "IN ACCEPT -source 137.110.161.106 -p tcp -dport 9221 -log nolog # prometheus-pve-exporter (krg-prod)"
  # ACME HTTP-01 (proxmox_acme role) — Let's Encrypt cert for the pveproxy web UI.
  # PVE opens a transient listener on :80 only during issuance/renewal; pveproxy
  # itself stays on :8006 (restricted to ucsd+ops in cluster.fw). NO source
  # restriction ON PURPOSE: LE does multi-perspective validation from US/EU/Asia
  # validators with unpredictable source IPs — any allowlist risks breaking
  # issuance/renewal (same reasoning as nix krg-vault's publicPorts=[80]). The only
  # thing reachable on :80 is the /.well-known/acme-challenge path during a challenge.
  - "IN ACCEPT -p tcp -dport 80 -log nolog # ACME HTTP-01 (Let's Encrypt; public, multi-perspective)"

# ── Let's Encrypt cert for the PVE web UI (proxmox_acme role) ─────────────────
# PVE-native ACME, HTTP-01 standalone. Issues + auto-renews (pve-daily-update) the
# pveproxy cert for fabricant.ucsd.edu, replacing the self-signed default. The :80
# challenge port is opened in proxmox_host_fw_rules above.
#
# STAGING-FIRST: brought up against LE's rate-limit-free staging endpoint, the UI
# served the staging chain, so this is now flipped to `production` for a publicly-
# trusted cert. On the staging→production switch the role registers the prod ACME
# account and re-orders with --force (the staging cert isn't "expiring", but its
# issuer marks it as the wrong environment, so it's replaced). To roll back to
# staging, set this to `staging` and re-run.
proxmox_acme_enable: true
proxmox_acme_domain: "fabricant.ucsd.edu"
proxmox_acme_contact: "e4e@ucsd.edu"       # LE expiry notices (matches the Traefik ACME contact)
proxmox_acme_environment: production        # real Let's Encrypt (staging validated first)

# ── NFS exports ──────────────────────────────────────────────────────────────
nfs_exports:
  # /home over NFS — gives AD users a home OFF a host's local root (the blocker for
  # re-enabling impermanence on waiter; see CLAUDE.md). Clients mount this at /home,
  # matching SSSD fallback_homedir=/home/%u.
  #
  # no_root_squash: pam_mkhomedir on the CLIENT runs as root and must create + chown
  # each user's dir on this share; root_squash would map root -> `nobody` and first
  # login would fail. It's scoped to the managed client IPs below. Prefer to keep
  # root_squash? Then pre-create homes on the server and drop no_root_squash here.
  - name: home
    fsid: 11
    dataset_props:
      # Opt this dataset IN to auto-snapshots (all five cadences). The nfs_server role
      # runs the zfs-auto-snapshot timers that act on this property (--default-exclude,
      # so only opted-in datasets); retention mirrors nix krg.zfs.autoSnapshot.
      "com.sun:auto-snapshot": "true"
    clients:
      # The host(...) entries are EXPORT ACLs on this server only — they don't touch
      # the clients' own configs. Add member hosts that mount /home here.
      - { host: "137.110.161.67", options: "rw,sync,no_subtree_check,no_root_squash" }   # waiter
      # - { host: "137.110.161.106", options: "rw,sync,no_subtree_check,no_root_squash" } # krg-prod

  # Cold tier for waiter's krg /scratch (nix krg.scratch). The daily scratch-overflow
  # job on waiter demotes least-recently-accessed krg scratch files here and leaves a
  # symlink; users pull them back themselves with scratch-restore. Per-LAB export (krg
  # and e4e are independent labs sharing this infra): e4e gets its own export/NAS
  # later, so keep this scoped to scratch-krg.
  #
  # no_root_squash: scratch-overflow runs as ROOT on waiter and moves arbitrary users'
  # files onto this share preserving their owner/group — root_squash would map root ->
  # `nobody` and break ownership/perms (the lab-isolation gate). Scoped to waiter's IP.
  # recordsize=1M matches the bulk/sequential scratch profile; daily+ snapshots only.
  #
  # (Replaces the former generic `bulk` export, which was unused — the per-lab scratch
  #  exports supersede it. The rpool/nfs/bulk DATASET, if it still exists, is removed
  #  out-of-band after confirming it's empty: `zfs destroy rpool/nfs/bulk` — NOT here.)
  - name: scratch-krg
    fsid: 12
    # Export-root perms MIRROR the lab gate on waiter's /scratch/krg (nix krg.scratch
    # sets 3770 root:<lab group>), minus write. scratch-restore runs as the USER and
    # reads the archived copy through this directory, so lab members need traverse
    # (--x) here or every restore fails "archive target missing ... is NFS mounted?"
    # with the data intact underneath (the state this fixes: it was root-only 0700).
    # 0710, not 0770/0755: members traverse to their own 0700 subtree, nobody can list
    # the top level (it's a roster of usernames), and only the root-run overflow job
    # creates entries here. Group is the NUMERIC gid of KRG\Kastner Research Group —
    # fabricant isn't domain-joined, and the id is algorithmic from the AD SID, so it
    # is the same number every host computes (`getent group` on waiter to confirm).
    root_owner: "0"
    root_group: "751001121"
    root_mode: "0710"
    dataset_props:
      recordsize: "1M"
      "com.sun:auto-snapshot": "true"
      "com.sun:auto-snapshot:frequent": "false"
      "com.sun:auto-snapshot:hourly": "false"
    clients:
      - { host: "137.110.161.67", options: "rw,sync,no_subtree_check,no_root_squash" }   # waiter (scratch cold tier)
