# Garage S3 object store on e4e-nas — ADRs 0002, 0003 — source of truth for
# the `synology_garage` Ansible role: deployment, garage.toml config, cluster
# bootstrap, and bucket / key management (#101 sub-PR 5). Bucket-level
# quotas/policies beyond read/write/owner grants remain out of scope.
#
# Why Ansible and not Terraform: `synology_container_project` hit three
# distinct upstream bugs in one session (#110/#113/#114). See
# docs/adr/0007-dsm-config-ansible-not-terraform.md "Garage retreat".
#
# Secrets are NOT in this file. rpc_secret / admin_token / metrics_token are
# supplied at apply-time as extra_vars (`-e @~/.config/krg/secrets-garage.yml`,
# operator-local, mode 0600, outside the repo). The render-config task carries
# `no_log: true` so they never touch ansible logs. #110 (OpenBao migration)
# supersedes the operator-managed secrets file. Generate each with
# `openssl rand -hex 32`.

deployment:
  image: dxflrs/garage
  # v2.x is required for the garage-ui admin UI (uses the /v2/ admin API).
  # Upstream v1→v2 migration is "restart all nodes at once with the new
  # binary, on-disk data + layout are compatible, only `replication_mode`
  # config-key is dropped" — our spec already uses `replication_factor` so
  # no config changes needed. Our cluster is fresh (no buckets/keys/data),
  # so worst case is re-running `layout assign + apply` (the role does it
  # idempotently). Pinned per ADR 0002 — bump deliberately + verify changelog.
  image_tag: v2.3.0
  container_name: garage
  network_mode: host                      # single-node — host is simplest; revisit if a 2nd node lands
  # On-disk paths are explicit (no volume guessing). The terraform-tracked
  # FileStation folder `/docker/garage` maps to whichever volume hosts the
  # `docker` share; record the absolute path here so the role doesn't have
  # to guess. These MUST track the `docker` share's path in shares.yml
  # (/volume2/docker) — see the drift warning below.
  #
  # WAS /volume1/docker/garage until 2026-07-29. The pre-spec, operator-created
  # `docker` share lived on /volume1; shares.yml declares it on /volume2 and the
  # live share was reconciled to /volume2/docker, but these paths were left
  # pinned at /volume1 ("match the running container, clean up separately").
  # /volume1/docker then went away with the old share. The running container
  # kept its already-resolved bind mount, so NOTHING BROKE UNTIL A RESTART:
  # the NAS rebooted 2026-07-29 ~22:55Z and both containers came back
  # `Exited (128) Bind mount failed: '<path>' does not exist`, which surfaced
  # as a 502 from the AppPortal reverse proxy on s3.e4e.ucsd.edu.
  #
  # Recovery was config-only: garage.toml / config.yaml / keys_dir are all
  # RE-RENDERABLE from this spec plus OpenBao (secret/e4e-nas/garage,
  # .../garage-ui-oidc, .../garage-keys/*), and the object data + cluster
  # layout + node identity live in data_dir/meta_dir on /volume2/s3-data,
  # which was never touched.
  compose_path: /volume2/docker/garage/docker-compose.yml
  config_path: /volume2/docker/garage/garage.toml
  data_dir: /volume2/s3-data/data
  meta_dir: /volume2/s3-data/meta
  restart_policy: unless-stopped
  rust_log: garage=info,garage_api=info,garage_block=info
  # Where sync-keys renders each access key's secret (<name>.env, root:root
  # 0400) from OpenBao truth. Garage only returns secretAccessKey once, at
  # creation, so this file is the only copy ON THE BOX — but not the durable
  # one: OpenBao (secret/e4e-nas/garage-keys/<name>) is, and sync-keys
  # IMPORTs from it, so a lost keys_dir is restored, not rotated (#75). See
  # roles/synology_garage/README.md "Key secrets".
  keys_dir: /volume2/docker/garage/keys

# Structural garage.toml — rendered with secrets injected at apply-time.
config:
  db_engine: lmdb
  replication_factor: 1                   # single-node; bumping requires layout rebalance
  compression_level: 2
  rpc_bind_addr: "[::]:3901"
  # Single-node only — loopback is fine because no peer ever dials this
  # field. Adding a 2nd node would require setting this to the NAS primary
  # IP first (e.g. `132.239.17.124:3901`), restarting, then joining.
  rpc_public_addr: 127.0.0.1:3901
  s3_api:
    api_bind_addr: "[::]:3900"
    region: garage
    root_domain: .s3.e4e.ucsd.edu  # path-style endpoint https://s3.e4e.ucsd.edu; virtual-host buckets <bucket>.s3.e4e.ucsd.edu (public AppPortal + LE SAN in #116)
  s3_web:
    bind_addr: "[::]:3902"
    # Static-site serving from buckets. Not publicly exposed yet (no DNS record);
    # kept in the e4e zone for consistency with the s3 endpoint above.
    root_domain: .web.e4e.ucsd.edu
    index: index.html
  admin:
    api_bind_addr: "[::]:3903"

cluster:
  zone: dc1                               # single-zone, single-node
  capacity: 5T                            # sized to s3-data free space; capacity bumps are operator-driven (rebalance side-effect)
  # NOTE: the role refuses to mutate an already-defined layout (anti-rebalance
  # guard). To change capacity, run `garage layout assign` + `apply` on the
  # NAS manually after thinking about the rebalance impact.

# --- Admin UI (Noooste/garage-ui) ---------------------------------------------
# Browser-based bucket / access-key / cluster admin + S3 object browse +
# drag-and-drop upload, gated by Authentik SSO via native OIDC. Talks to
# Garage on loopback (`localhost:3900` S3, `localhost:3903` admin). Public
# access via a DSM AppPortal reverse-proxy on `s3-admin.e4e.ucsd.edu` (443),
# its own DNS name with a SAN on the host LE cert. Fully declarative: the
# reverse-proxy entry is in app-portal.yml, the cert SAN in certificates.yml,
# and the Authentik OIDC provider in terraform/authentik — nothing hand-made
# on the box for the declarative sync to reap.
#
# TOOL CHOICE NOTE: Noooste/garage-ui is the only Garage admin UI today that
# speaks OIDC natively. Long-term plan is to swap to the official
# Deuxfleurs/garage-webadmin once it leaves "do not use yet" (NLnet-funded;
# tracking issue #117). Bucket/key spec is declarative, so the swap is
# "redeploy + re-apply" — cheap.
ui:
  image: noooste/garage-ui
  image_tag: "v0.8.0"                     # tags are v-prefixed on Docker Hub; v2.x admin API required (latest as of 2026-06; bump per ADR 0002 w/ changelog)
  container_name: garage-ui
  # Same /volume1 → /volume2 repoint as deployment.* above (2026-07-29) — the
  # terraform-tracked FileStation folder is `/docker/garage-ui`, which now
  # resolves under /volume2/docker. NOTE: render-ui-config generates
  # jwt-key.pem next to config_path and it was NOT recoverable from the lost
  # /volume1 dir, so a fresh key is generated here — that only invalidates
  # existing garage-ui login sessions (users re-auth through Authentik).
  compose_path: /volume2/docker/garage-ui/docker-compose.yml
  config_path: /volume2/docker/garage-ui/config.yaml
  bind_host: 127.0.0.1                    # loopback only; DSM AppPortal terminates TLS publicly
  port: 8080                              # internal UI port; the AppPortal entry proxies the public port here

  # Public access. The admin UI has its own DNS name `s3-admin.e4e.ucsd.edu`
  # (paired with the S3 API at `s3.e4e.ucsd.edu`), so it's served on standard
  # HTTPS (443) via a DSM AppPortal reverse-proxy. TLS uses a SAN on the host
  # LE cert (see certificates.yml). Authentik's OIDC redirect URI MUST match
  # `<public_url>/auth/oidc/callback` exactly (set in terraform/authentik).
  public_hostname: s3-admin.e4e.ucsd.edu
  public_port: 443                        # standard HTTPS; DSM web is on 6021 so 443 is free on the NAS
  public_url: https://s3-admin.e4e.ucsd.edu

  # OIDC — points at krg-prod's Authentik. client_secret is an extra_var
  # (`garage_ui_oidc_client_secret`) carried via `environment:` (no_log;
  # never on argv). #110 (OpenBao) eventually replaces the operator-managed
  # secret with a vault-backed lookup.
  oidc:
    provider_name: Authentik
    client_id: garage-ui
    # Authentik moved to auth.krg.ucsd.edu in the krg-prod CNAME migration.
    # Issuer URL pattern: https://<authentik-host>/application/o/<app-slug>/
    issuer_url: https://auth.krg.ucsd.edu/application/o/garage-ui/
    scopes: [openid, email, profile, groups]
    # Authentik puts the user's groups under the `groups` top-level claim.
    role_attribute_path: groups
    # Admin = grants every UI capability (buckets, keys, browse, upload).
    # garage-ui grants admin on ANY match in this list (ANY-of). Names are
    # AD-sourced group names (synced via the LDAP source, ldap.tf). This is the
    # E4E Garage instance (e4e-nas); a future KRG Garage gets its own OIDC app
    # + "KRG Garage Admins"/"KRG Admins".
    #
    # NOTE: AD group-in-group nesting does NOT flatten through Authentik's LDAP
    # sync, so we list both groups here rather than nesting "E4E Admins" inside
    # "E4E Garage Admins" — membership in EITHER AD group grants admin.
    admin_roles:
      - E4E Garage Admins                 # dedicated AD group, for garage-specific grants
      - E4E Admins                        # for now: all E4E admins are garage admins

# --- Sub-PR 5 of #101: bucket / key management --------------------------------
# `buckets:` entries become Garage global aliases (garage bucket create /
# CreateBucket) — the name IS the bucket, addressed path-style as
# https://s3.e4e.ucsd.edu/<name> (root_domain above) or virtual-host style
# <name>.s3.e4e.ucsd.edu once #118's wildcard cert lands.
#
# `keys:` entries become Garage access keys (garage key new / CreateKey),
# each granted the listed read/write/owner permissions on the named buckets
# (garage bucket allow / AllowBucketKey — DenyBucketKey removes anything no
# longer listed, so this is fully declarative, not additive-only). A key's
# secret is shown by Garage exactly once, at creation, and persisted to
# deployment.keys_dir/<name>.env (root:root 0400) — see
# roles/synology_garage/README.md "Key secrets" for how to retrieve it and
# seed it into OpenBao.
#
# BUCKET-PER-TRUST-BOUNDARY. Garage grants are per BUCKET, not per prefix, so
# the split is forced by "which key holder can touch these bytes":
#   - a project's INTERNAL artifacts get their own bucket, reachable only by the
#     project's own key.
#   - a project's LABEL images go in a SEPARATE `labels-<project>` bucket that an
#     OFF-BOX Label Studio (Heartex SaaS) key reads/writes. Per project, so one
#     Label Studio project's storage credential can't reach another's data.
# There is deliberately NO shared `label-studio` bucket: a single key on it would
# span every project's label data (removed 2026-07-09 — it was operator-created
# drift, never real spec state; see git history for the earlier single-bucket form).
#
# fishsense-lite (github.com/UCSD-E4E/fishsense-lite) runs OFF-INFRA (researcher
# CLI + Temporal workers), so its key is consumed from that project's own config,
# same as any external consumer — seed it wherever those workers run, not on a host.
#
# `cors:` (optional, per bucket) becomes the bucket's CORS rules, applied via the
# admin API's UpdateBucket `corsRules` — NOT `aws s3api put-bucket-cors`, which
# would need an `owner` grant handed to a human. Fields are the S3 CORSRule
# fields in snake_case: allowed_origins + allowed_methods (both required),
# allowed_headers, expose_headers, max_age_seconds, id. DECLARATIVE: a bucket
# with no `cors:` is converged to NO rules, so an out-of-band rule set is reaped.
#
# CORS is a BROWSER policy, not an access grant: it only tells a browser whether
# JS on some origin may READ a response it already had the credentials to fetch.
# Listing an origin here does NOT make the bucket public — objects are still
# reached only via a signed request (in the Label Studio case, a presigned GET
# minted by the `labels-<project>` key). So keep the origin list to the specific
# UIs that need it rather than `*`, but adding one is not an authz decision.
buckets:
  - name: fishsense-lite # internal pipeline artifacts (rectified/intermediate outputs)
  - name: labels-fishsense-lite # label-ready images handed off to Label Studio (Heartex SaaS)
    # Label Studio (Heartex SaaS) presigns s3://labels-fishsense-lite/... URIs and
    # the LABELER'S BROWSER on app.heartex.com fetches them straight from Garage,
    # cross-origin. Without these rules Garage 403s the preflight and sends no
    # Access-Control-Allow-Origin, so the labeling UI renders "issue loading URL
    # from $image value" even though the presigned GET itself is a clean 200.
    # Read-only methods only: annotations are written back through the
    # labels-fishsense-lite KEY (server-side, no browser CORS involved).
    cors:
      - allowed_origins: [https://app.heartex.com]
        allowed_methods: [GET, HEAD]
        allowed_headers: ["*"]
        expose_headers: [ETag, Content-Length, Content-Type]
        max_age_seconds: 3600
  # Trained model weights / checkpoints, shared across projects that consume
  # them. Grants are per bucket (the trust-boundary rule above), so consumers
  # get read on this bucket without gaining anything on a project's internal
  # artifacts. Nothing holds WRITE yet — whoever trains the models gets a
  # separate write-granted key so a consumer key can never overwrite weights.
  - name: model-weights

# Access keys. Only the NAME + bucket grants are declared here (git is truth);
# the actual {access_key_id, secret_access_key} is NOT in the spec. The control
# node create-once-provisions each in OpenBao (secret/e4e-nas/garage-keys/<name>)
# and synology_garage IMPORTS the key from it — so OpenBao is the durable source
# of truth and a lost NAS keys_dir is recoverable. See roles/synology_garage/
# README.md "Key secrets" (#75).
keys:
  # Held by the fishsense-lite pipeline: read/write its own artifacts, publish
  # label-ready images into the hand-off bucket Label Studio reads, and read
  # the shared trained model weights it runs inference with.
  - name: fishsense-lite
    buckets:
      - name: fishsense-lite
        permissions: [read, write]
      - name: labels-fishsense-lite
        permissions: [read, write]
      # Read-only: the pipeline consumes trained weights at inference time but
      # does not publish them, so whoever trains the models gets a separate
      # write-granted key rather than widening this one.
      - name: model-weights
        permissions: [read]
  # Held by Label Studio (Heartex SaaS) in THIS project's Cloud Storage config:
  # reads the images to label, writes annotations back. Scoped to this one
  # project's label bucket — cannot see fishsense-lite internal artifacts or any
  # other project's label data.
  - name: labels-fishsense-lite
    buckets:
      - name: labels-fishsense-lite
        permissions: [read, write]
